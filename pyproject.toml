[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-agent"
version = "0.1.0"
description = "Long-running autonomous AI agent with persistent memory and E2B execution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Autonomous Agent" }]
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "httpx==0.28.1",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "e2b-code-interpreter==1.0.4",
  "tenacity==9.1.2",
  "python-dotenv==1.1.0",
]

[project.scripts]
autonomous-agent = "autonomous_agent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
