services:
  - type: web
    name: autonomous-agent-api
    env: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn autonomous_agent.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AGENT_DB_PATH
        value: data/agent_state.db
      - key: FRONTEND_ORIGINS
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
